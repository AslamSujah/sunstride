version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: sunstride-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    networks:
      - sunstride-network

  sunstride:
    build: .
    container_name: sunstride-app
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      - ./data:/app/data
    depends_on:
      - ollama
    networks:
      - sunstride-network

volumes:
  ollama-data:

networks:
  sunstride-network:
    driver: bridge
