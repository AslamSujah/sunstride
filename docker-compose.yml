version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: sunstride-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    command: ollama serve
    networks:
      - sunstride-network

  sunstride:
    build: .
    container_name: sunstride-app
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
    volumes:
      - ./sunstride_journal.db:/app/sunstride_journal.db
      - ./outdoor_briefing.m4a:/app/outdoor_briefing.m4a
    depends_on:
      - ollama
    networks:
      - sunstride-network
    command: sh -c "ollama pull gemma2 && streamlit run app.py --server.port=8501 --server.address=0.0.0.0"

volumes:
  ollama-data:

networks:
  sunstride-network:
    driver: bridge
